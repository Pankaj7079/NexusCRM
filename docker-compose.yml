version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: nexuscrm_postgres
    restart: always
    environment:
      POSTGRES_DB: nexuscrm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexuscrm_redis
    restart: always
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nexuscrm_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: nexuscrm_mlflow
    restart: always
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts --host 0.0.0.0 --port 5000

volumes:
  postgres_data:
  qdrant_data:
